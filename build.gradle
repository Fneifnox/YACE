plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name 'Xander Maven'
		url 'https://maven.isxander.dev/releases'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE

	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

sourceSets {
	dev {
		compileClasspath += main.compileClasspath
		runtimeClasspath += main.runtimeClasspath
	}
}

boolean isReleaseBuild = providers.gradleProperty("release").present ||
		gradle.startParameter.taskNames.any { it.contains("build") || it.contains("jar") || it.contains("publish") }

if (!isReleaseBuild) {
	sourceSets.main.java.srcDirs += sourceSets.dev.java.srcDirs
	sourceSets.main.resources.srcDirs += sourceSets.dev.resources.srcDirs
} else {
	tasks.withType(JavaCompile).configureEach {
		exclude '**/TestConfigMenu.java'
	}
	jar {
		exclude '**/TestConfigMenu.class'
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {

	}
}
